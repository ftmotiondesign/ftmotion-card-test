hParams(location.search).get('kisi');async function get(table,query){let r=await fetch(BASE+'/rest/v1/'+table+query,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error('Veri okunamadı');return r.json()}function anchor(parent,label,href,disabled=false){let a=document.createElement('a');a.textContent=label;if(href)a.href=href;else{a.className='inactive';a.setAttribute('aria-disabled','true')}a.rel='noopener noreferrer';parent.append(a);return a}function personal(id,label,href){let a=$('#'+id);a.textContent=label;if(href){a.href=href;a.classList.remove('inactive');a.removeAttribute('aria-disabled')}else{a.removeAttribute('href');a.classList.add('inactive')}}async function init(){try{if(!slug)throw Error('Kişi adresi eksik');const people=await get('kf_people','?slug=eq.'+encodeURIComponent(slug)+'&select=*');if(!people.length)throw Error('Bu kişi için henüz test kaydı bulunamadı');const p=people[0];$('#name').textContent=p.full_name;$('#title').textContent=p.job_title||'';if(p.photo_url){$('#avatar').replaceChildren();let im=document.createElement('img');im.src=p.photo_url;im.alt='Profil';$('#avatar').append(im)}if(p.cover_url){let im=document.createElement('img');im.src=p.cover_url;im.alt='Kapak';$('#cover').prepend(im)}personal('personalMobile','📱 Cep',p.mobile?'tel:'+p.mobile:'');personal('personalWhatsApp','◉ WA',p.whatsapp?'https://wa.me/'+p.whatsapp.replace(/\D/g,''):'');personal('personalEmail','✉ Mail',p.email?'mailto:'+p.email:'');const links=await get('kf_links','?person_id=eq.'+p.id+'&select=firm_id,sort_order&order=sort_order.asc');if(!links.length){$('#firm').textContent='Henüz bağlı firma bulunmuyor';return}const ids=links.map(x=>x.firm_id);const firms=await get('kf_firms','?id=in.('+ids.join(',')+')&select=*');const ordered=ids.map(id=>firms.find(f=>f.id===id)).filter(Boolean);function render(i){const f=ordered[i];$('#firm').textContent=f.name;$('#desc').textContent=f.description||'';$('#contacts').replaceChildren();for(const [label,href] of [['☎ Telefon',f.phone?'tel:'+f.phone:''],['▣ Cep Ara',f.mobile?'tel:'+f.mobile:''],['◉ WhatsApp',f.whatsapp?'https://wa.me/'+f.whatsapp.replace(/\D/g,''):''],['✉ E-posta',f.email?'mailto:'+f.email:'']])anchor($('#contacts'),label,href);$('#note').textContent=f.address||'Adres henüz eklenmedi';$('#firmLinks').replaceChildren();if(f.address)anchor($('#firmLinks'),'📍 Yol Tarifi','https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(f.address));if(f.website)anchor($('#firmLinks'),'🌐 Web Sitesi',f.website);if(f.external_card_url)anchor($('#firmLinks'),'↗ İşletme Kartı',f.external_card_url);document.querySelectorAll('#tabs button').forEach((b,j)=>b.classList.toggle('on',i===j))}ordered.forEach((f,i)=>{const b=document.createElement('button');b.textContent=f.name;b.onclick=()=>render(i);$('#tabs').append(b)});render(0)}catch(e){$('#name').textContent=e.message;$('#firm').textContent='Test kaydı bekleniyor'}}init();</script>
