<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Başol Kişisel Kart Test</title><style>body{background:#101114;color:white;font:16px system-ui;margin:0}main{max-width:520px;margin:30px auto;padding:20px}h1{text-align:center}.card{background:#22242a;border:1px solid #444;border-radius:15px;padding:18px;margin:12px 0}a{display:block;background:#ff8a00;color:#111;text-decoration:none;padding:15px;border-radius:12px;margin:10px 0;font-weight:bold;text-align:center}</style></head><body><main><h1 id="name">Kişisel Kart</h1><div class="card" id="contacts"></div><h2>Firmalarım</h2><div id="firms"></div><p>FTMotion · Test kartı (canlı kayıt değildir)</p></main><script type="module">
import {client} from './shared/supabase-client.js';
const id=new URLSearchParams(location.search).get('id');
const name=document.getElementById('name'),contacts=document.getElementById('contacts'),firms=document.getElementById('firms');
try{
 const db=await client();
 const {data:p,error}=await db.from('ft_person_cards_pilot').select('full_name,phone,whatsapp,email,firms').eq('slug',id||'').eq('published',true).maybeSingle();
 if(error)throw error;
 if(!p){name.textContent='Kart henüz yayımlanmadı';contacts.textContent='Kartı yönetim panelinden kalıcı olarak oluşturun.'}
 else{
 name.textContent=p.full_name;
 for(const [label,v,prefix] of [['Cep',p.phone,'tel:'],['WhatsApp',p.whatsapp,'https://wa.me/'],['E-posta',p.email,'mailto:']]){
 if(!v)continue;
 const a=document.createElement('a');a.textContent=label;a.href=prefix+(label==='WhatsApp'?v.replace(/[^0-9]/g,''):v);contacts.append(a)}
 for(const f of p.firms||[]){if(!f.url?.startsWith('https://'))continue;const a=document.createElement('a');a.textContent=f.name;a.href=f.url;firms.append(a)}
 }
}catch(e){name.textContent='Kart yüklenemedi';contacts.textContent=e.message||'Bağlantıyı kontrol edin'}
</script></body></html>
