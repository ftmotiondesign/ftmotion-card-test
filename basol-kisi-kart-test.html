<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Başol Kişisel Kart Test</title><style>body{background:#101114;color:white;font:16px system-ui;margin:0}main{max-width:520px;margin:30px auto;padding:20px}h1{text-align:center}.card{background:#22242a;border:1px solid #444;border-radius:15px;padding:18px;margin:12px 0}a{display:block;background:#ff8a00;color:#111;text-decoration:none;padding:15px;border-radius:12px;margin:10px 0;font-weight:bold;text-align:center}</style></head><body><main><h1 id="name">Kişisel Kart</h1><div class="card" id="contacts"></div><h2>Firmalarım</h2><div id="firms"></div><p>FTMotion · Test kartı (canlı kayıt değildir)</p></main><script>const id=new URLSearchParams(location.search).get('id');let s;try{s=JSON.parse(localStorage.getItem('basol-person-firm-demo-v1'))}catch(e){}let p=s?.persons?.find(x=>x.id===id);if(p){document.getElementById('name').textContent=p.name;const c=document.getElementById('contacts');for(const [label,v,prefix] of [['Cep',p.phone,'tel:'],['WhatsApp',p.wa,'https://wa.me/'],['E-posta',p.email,'mailto:']]){if(v){let a=document.createElement('a');a.textContent=label;a.href=prefix+v.replace(prefix==='https://wa.me/'?/\D/g:/^$/g,'');c.append(a)}}for(const fid of p.firms){let f=s.firms.find(x=>x.id===fid);if(f){let a=document.createElement('a');a.textContent=f.name;a.href=f.url||'#';if(!f.url)a.onclick=e=>{e.preventDefault();alert('Bu firmanın kart bağlantısı henüz girilmedi')};document.getElementById('firms').append(a)}}}else document.getElementById('name').textContent='Bu tarayıcıda test kartı bulunamadı';</script></body></html>
