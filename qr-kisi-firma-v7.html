<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTMotion Kişi Firma QR Test</title><style>body{font:15px system-ui;background:#f3f4f7;margin:0;padding:18px;color:#17243b}.card{max-width:430px;margin:20px auto;background:#19191b;color:white;border-radius:22px;overflow:hidden}.banner{height:130px;background:linear-gradient(135deg,#373737,#111)}.body{padding:16px;text-align:center}.avatar{font-size:40px;margin-top:-35px}h1{font-size:19px;margin:4px}small{color:#ffa33d}.tabs{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:18px 0}.tabs button{background:#303033;border:0;border-radius:9px;color:white;padding:12px;cursor:pointer}.tabs button.on{background:#ff8800;color:#111}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions a{color:white;text-decoration:none;background:#303033;padding:12px;border-radius:10px}.muted{font-size:12px;color:#aaa}.warn{max-width:430px;margin:auto;color:#754a00;background:#fff1d5;padding:12px;border-radius:12px;font-size:12px}</style></head><body><div class="warn">🧪 FTMotion bağımsız QR testi. Bu sayfa canlı işletme kartı değildir.</div><div class="card"><div class="banner"></div><div class="body"><div class="avatar">👤</div><h1 id="person"></h1><small id="title">Kişisel dijital kart · TEST</small><div class="tabs" id="tabs"></div><h2 id="firm"></h2><p class="muted" id="info"></p><div class="actions"><a id="phone" href="#">Cep Ara</a><a id="mail" href="#">E-posta</a><a id="real" href="#" target="_blank">İşletme Kartı</a><a id="share" href="#">Paylaş</a></div></div></div><script>const q=new URLSearchParams(location.search);const slug=q.get('kisi')||'burak-basol';const people={'burak-basol':'Burak Başol','yusuf-basol':'Yusuf Başol'};const name=q.get('ad')||people[slug]||slug.split('-').map(s=>s.charAt(0).toUpperCase()+s.slice(1)).join(' ');document.getElementById('person').textContent=name;const firms=(q.get('firmalar')||'basol-yapi').split(',').filter(Boolean);const clean=s=>s.replace(/[^a-z0-9-]/g,'');function select(s){s=clean(s);document.getElementById('firm').textContent=s.split('-').map(t=>t.charAt(0).toUpperCase()+t.slice(1)).join(' ');document.getElementById('info').textContent='Firma bilgileri test önizlemesi';document.getElementById('real').href='https://ftmotion.com/qr/'+s;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.slug===s))}firms.forEach(s=>{const b=document.createElement('button');b.dataset.slug=clean(s);b.textContent=s.replace(/-/g,' ');b.onclick=()=>select(s);document.getElementById('tabs').append(b)});select(q.get('firma')||firms[0]);document.getElementById('share').onclick=e=>{e.preventDefault();navigator.clipboard?.writeText(location.href).then(()=>alert('Test bağlantısı kopyalandı'))};</script></body></html>
