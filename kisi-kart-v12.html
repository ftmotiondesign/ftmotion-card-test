<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FTMotion Kişisel Kart Test V12</title><style>*{box-sizing:border-box}body{margin:0;background:#101011;color:#fff;font:14px system-ui}.card{max-width:460px;margin:auto;min-height:100vh;background:#171719}.cover{height:175px;background:linear-gradient(120deg,#363639,#141414)}.cover img{width:100%;height:100%;object-fit:cover}.profile{text-align:center;margin-top:-50px;position:relative}.avatar{height:96px;width:96px;border:4px solid #171719;border-radius:18px;object-fit:cover;background:#414147}.profile h1{margin:6px;font-size:23px}.title{color:#ff8800;font-size:12px}.personal{display:flex;justify-content:center;gap:7px;margin:14px}.personal a{color:white;text-decoration:none;background:#29292d;padding:8px 13px;border-radius:30px;font-size:12px}.tabs{display:flex;overflow:auto;gap:7px;margin:15px;padding:6px;background:#202023;border-radius:15px}.tabs button{border:0;border-radius:10px;background:transparent;color:#ddd;padding:12px;min-width:100px;flex:1}.tabs button.active{background:#ff8800;color:white}.details{margin:20px;padding-top:15px;border-top:1px solid #353535}h2{text-align:center}.description{text-align:center;color:#aaa}.contacts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.contacts a{color:white;text-decoration:none;background:#242427;padding:15px;border-radius:12px}.info{padding:14px;background:#242427;border-radius:12px;margin-top:13px;white-space:pre-line}.info a{color:#ff8800}.foot{text-align:center;color:#888;font-size:11px;padding:18px}</style><main class="card"><div class="cover" id="cover"></div><div class="profile"><img class="avatar" id="photo"><h1 id="name">Yükleniyor…</h1><div class="title" id="title"></div></div><div class="personal" id="personal"></div><div style="text-align:center;color:#aaa;margin:14px">▦ Firmalarım</div><div class="tabs" id="tabs"></div><div class="details"><h2 id="firm"></h2><div class="description" id="desc"></div><div class="contacts" id="contacts"></div><div class="info" id="info"></div></div><div class="foot">FTMotion bağımsız QR test kartı</div></main><script>const BASE="https://ynmsptdqqzhijyamtlqz.supabase.co",KEY="sb_publishable_dM32rJGzJwV9QTYLWJTwYw_Xrz517VM";const $=s=>document.querySelector(s);const slug=new URLSearchParams(location.search).get('kisi');function link(container,label,href){if(!href)return;let a=document.createElement('a');a.textContent=label;a.href=href;a.rel='noopener noreferrer';container.append(a)}async function get(table,query){let r=await fetch(BASE+'/rest/v1/'+table+query,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error('Veri okunamadı');return r.json()}async function init(){try{if(!slug)throw Error('Kişi bağlantısı eksik');const people=await get('kf_people','?slug=eq.'+encodeURIComponent(slug)+'&select=*');if(!people.length)throw Error('Bu kişiye ait test kaydı bulunamadı');const p=people[0];$('#name').textContent=p.full_name;$('#title').textContent=p.job_title||'';if(p.photo_url)$('#photo').src=p.photo_url;else $('#photo').style.background='#444';if(p.cover_url){let img=document.createElement('img');img.src=p.cover_url;$('#cover').append(img)}link($('#personal'),'📱 Cep',p.mobile?'tel:'+p.mobile:'');link($('#personal'),'◉ WhatsApp',p.whatsapp?'https://wa.me/'+p.whatsapp.replace(/\D/g,''):'');link($('#personal'),'✉ Mail',p.email?'mailto:'+p.email:'');const links=await get('kf_links','?person_id=eq.'+p.id+'&select=firm_id,sort_order&order=sort_order.asc');if(!links.length){$('#firm').textContent='Henüz bağlı firma yok';return}const ids=links.map(x=>x.firm_id);const firms=await get('kf_firms','?id=in.('+ids.join(',')+')&select=*');const ordered=ids.map(id=>firms.find(f=>f.id===id)).filter(Boolean);function render(i){let f=ordered[i];$('#firm').textContent=f.name;$('#desc').textContent=f.description||'';$('#contacts').replaceChildren();link($('#contacts'),'☎ Telefon',f.phone?'tel:'+f.phone:'');link($('#contacts'),'📱 Cep',f.mobile?'tel:'+f.mobile:'');link($('#contacts'),'◉ WhatsApp',f.whatsapp?'https://wa.me/'+f.whatsapp.replace(/\D/g,''):'');link($('#contacts'),'✉ E-posta',f.email?'mailto:'+f.email:'');$('#info').replaceChildren();const t=document.createElement('div');t.textContent=f.address||'Adres eklenmedi';$('#info').append(t);link($('#info'),'🗺 Yol Tarifi',f.address?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(f.address):'');link($('#info'),' Web Sitesi',f.website);link($('#info'),' Firma Kartını Aç',f.external_card_url);document.querySelectorAll('.tabs button').forEach((b,j)=>b.classList.toggle('active',i===j))}ordered.forEach((f,i)=>{const b=document.createElement('button');b.textContent=f.name;b.onclick=()=>render(i);$('#tabs').append(b)});render(0)}catch(e){$('#name').textContent=e.message}}init();</script></html>
